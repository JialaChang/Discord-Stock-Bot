<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0a0c10;
      --surface: #0f1218;
      --header: #151a23;
      --zebra: rgba(255, 255, 255, .018);
      --hover: rgba(224, 163, 62, .07);
      --border: #232a36;
      --grid: #1a202a;
      --text: #ccd2dc;
      --muted: #6b7484;
      --accent: #e0a33e;
      /* TW convention: red = up, green = down (opposite of Western charts) */
      --up: #ff5265;
      --down: #2ecc80;
      --flat: #6b7484;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "DejaVu Sans Mono", "Liberation Mono", "PingFang TC",
              "Microsoft JhengHei", monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #e9ecef;
        --surface: #ffffff;
        --header: #f2f4f7;
        --zebra: rgba(0, 0, 0, .015);
        --hover: rgba(168, 106, 16, .07);
        --border: #d3d9e0;
        --grid: #e7eaee;
        --text: #14181f;
        --muted: #6a7280;
        --accent: #a86a10;
        --up: #cc1122;
        --down: #0a8a4a;
        --flat: #6a7280;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 36px 20px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 2px;
      padding: 22px 26px 30px;
    }

    /* --- Masthead --- */
    h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .02em;
      margin: 0 0 6px;
      color: var(--text);
    }

    .meta {
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: .02em;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    /* --- Section labels --- */
    h2 {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--accent);
      margin: 30px 0 0;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
    }

    h2 + table { margin-top: 0; }

    /* --- Tables --- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
    }

    th, td {
      padding: 6px 14px;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child { text-align: left; }

    /* Vertical hairlines — 1px max, kept faint so they read as a grid, not clutter */
    th + th, td + td { border-left: 1px solid var(--grid); }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--header);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      padding-top: 9px;
      padding-bottom: 9px;
      /* inset shadow instead of border: collapsed borders don't stick */
      box-shadow: inset 0 -1px 0 var(--border), inset 0 1px 0 var(--border);
    }

    tbody td { border-bottom: 1px solid var(--grid); }
    tbody tr:nth-child(even) { background: var(--zebra); }
    tbody tr:hover { background: var(--hover); }
    tbody tr:last-child td { border-bottom: none; }

    /* Headerless summary tables: emphasise the label column */
    table:not(:has(thead)) td:first-child { color: var(--muted); }

    /* html_table puts these classes on the <td> itself: paint-only properties.
       `display` / `padding` / `border` here breaks header-to-column alignment. */
    .up   { color: var(--up);   font-weight: 700; }
    .down { color: var(--down); font-weight: 700; }
    .flat { color: var(--flat); }

    @media (max-width: 720px) {
      body { padding: 16px 8px 40px; font-size: 12px; }
      .container { padding: 16px 12px 20px; }
      h1 { font-size: 15px; }
      th, td { padding: 5px 8px; font-size: 11px; }
    }

    @media print {
      body { background: #fff; padding: 0; }
      .container { border: none; max-width: none; padding: 0; }
      thead th { position: static; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>$title</h1>

    $meta

    $body
  </div>
</body>

</html>
